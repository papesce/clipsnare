<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2b27" />
      <stop offset="100%" stop-color="#0f3d36" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" rx="12" fill="url(#bg)" />

  <!-- Decorative dashed circles -->
  <circle cx="180" cy="60" r="40" stroke="#0f766e" stroke-width="1" stroke-dasharray="4 3" opacity="0.2" />
  <circle cx="1100" cy="260" r="55" stroke="#0f766e" stroke-width="1" stroke-dasharray="4 3" opacity="0.15" />
  <circle cx="1200" cy="80" r="25" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 2" opacity="0.18" />
  <circle cx="80" cy="250" r="30" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 2" opacity="0.15" />

  <!-- Logo icon -->
  <g transform="translate(518, 30) scale(3)">
    <circle cx="16" cy="16" r="13" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3" />
    <path d="M27 8c2.5-2 4-1.5 4.5 0" stroke="#0f766e" stroke-width="2" stroke-linecap="round" fill="none" />
    <rect x="9" y="10" width="14" height="12" rx="2" fill="#26312d" stroke="#3d5650" stroke-width="0.5" />
    <rect x="10.5" y="12" width="2" height="2" rx="0.5" fill="#a0c4bc" />
    <rect x="10.5" y="18" width="2" height="2" rx="0.5" fill="#a0c4bc" />
    <rect x="19.5" y="12" width="2" height="2" rx="0.5" fill="#a0c4bc" />
    <rect x="19.5" y="18" width="2" height="2" rx="0.5" fill="#a0c4bc" />
    <polygon points="14.5,13 14.5,19 19,16" fill="#0f766e" />
  </g>

  <!-- App name -->
  <text x="640" y="170" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">ClipSnare</text>

  <!-- Tagline -->
  <text x="640" y="205" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#7fb8ae">Extract direct MP4 links from any web page</text>

  <!-- Feature pills -->
  <g transform="translate(340, 235)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#0f766e" opacity="0.25" />
    <text x="65" y="21" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fb8ae">Fast Scan</text>
  </g>
  <g transform="translate(490, 235)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#0f766e" opacity="0.25" />
    <text x="65" y="21" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fb8ae">Deep Scan</text>
  </g>
  <g transform="translate(640, 235)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f766e" opacity="0.25" />
    <text x="75" y="21" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fb8ae">Video Preview</text>
  </g>
  <g transform="translate(810, 235)">
    <rect x="0" y="0" width="135" height="32" rx="16" fill="#0f766e" opacity="0.25" />
    <text x="67" y="21" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fb8ae">Docker Ready</text>
  </g>

  <!-- Subtle bottom accent -->
  <rect x="490" y="290" width="300" height="2" rx="1" fill="#0f766e" opacity="0.3" />
</svg>
