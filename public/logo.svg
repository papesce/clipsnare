<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Snare/lasso circle -->
  <circle cx="16" cy="16" r="13" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3" />
  <!-- Snare knot tail -->
  <path d="M27 8c2.5-2 4-1.5 4.5 0" stroke="#0f766e" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Film clip rectangle -->
  <rect x="9" y="10" width="14" height="12" rx="2" fill="#26312d" />
  <!-- Film perforations left -->
  <rect x="10.5" y="12" width="2" height="2" rx="0.5" fill="#f7f8f6" />
  <rect x="10.5" y="18" width="2" height="2" rx="0.5" fill="#f7f8f6" />
  <!-- Film perforations right -->
  <rect x="19.5" y="12" width="2" height="2" rx="0.5" fill="#f7f8f6" />
  <rect x="19.5" y="18" width="2" height="2" rx="0.5" fill="#f7f8f6" />
  <!-- Play triangle -->
  <polygon points="14.5,13 14.5,19 19,16" fill="#0f766e" />
</svg>
